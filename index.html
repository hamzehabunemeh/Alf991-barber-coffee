<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>alf991 Barber & Coffee</title>
<meta name="description" content="alf991 barber & coffee, Amman. Old-school barbering and a coffee bar under one roof.">
<meta name="theme-color" content="#0a0806">
<link rel="icon" href="media/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Tajawal:wght@300;400;500;700&display=swap">
<style>
/* Direction: black and champagne gold, hairline frames, serif display. No colour accents beyond gold. */
:root{
  --ink:#0a0806; --coal:#100c09; --panel:#140f0b; --line:rgba(214,179,112,.24); --line-soft:rgba(214,179,112,.12);
  --gold:#d6b370; --gold-hi:#f3dfa8; --gold-lo:#9c7a3e; --ivory:#f4ecdc; --mute:#a99a7e;
  --f-display:'Cormorant Garamond','Times New Roman',serif;
  --f-body:'Jost','Helvetica Neue',Arial,sans-serif;
  --foil:linear-gradient(180deg,#f8e8bd 0%,#d9b673 48%,#a2793a 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--ivory);font-family:var(--f-body);font-weight:300;font-size:17px;line-height:1.7;overflow-x:hidden}
html[lang=ar]{--f-display:'Amiri','Times New Roman',serif}
html[lang=ar] body{font-family:'Tajawal','Jost',sans-serif;font-size:18px}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:1px solid var(--gold-hi);outline-offset:4px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.08;text-wrap:balance}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{font-weight:700;line-height:1.35}
.eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:400}
html[lang=ar] .eyebrow{letter-spacing:.05em;font-size:.95rem}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
.orn{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--gold);margin:22px auto;max-width:260px}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-lo))}
.orn::after{transform:scaleX(-1)}
.orn i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 34px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;
  font-size:.74rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;transition:.35s;white-space:nowrap}
html[lang=ar] .btn{letter-spacing:.02em;font-size:1rem;text-transform:none}
.btn:hover{background:var(--gold);color:var(--ink)}
.btn.solid{background:var(--gold);color:var(--ink)}
.btn.solid:hover{background:var(--gold-hi);border-color:var(--gold-hi)}

/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(10,8,6,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:22px;height:68px}
.brand{font-family:var(--f-display);font-size:1.55rem;letter-spacing:.08em;font-weight:500;white-space:nowrap}
html[lang=ar] .brand{font-weight:700;letter-spacing:0;font-size:1.65rem}
.lang{border:1px solid var(--line);background:none;padding:7px 15px;cursor:pointer;color:var(--gold);font-size:.8rem;letter-spacing:.1em}
.lang:hover{border-color:var(--gold)}

.brand{margin-inline-end:auto}
.burger{width:46px;height:42px;border:1px solid var(--line);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.3s}
.burger:hover{border-color:var(--gold)}
.burger span{display:block;width:22px;height:1px;background:var(--gold)}
.menu-ov{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100vh;height:100dvh;z-index:90;background:#080604;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(28px,env(safe-area-inset-top,0px)) 24px max(28px,env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s;overflow-y:auto}
.menu-ov::before{content:"";position:absolute;inset:14px;border:1px solid var(--line-soft);pointer-events:none}
.menu-ov.on{opacity:1;visibility:visible;transition:opacity .4s ease}
.menu-ov .close{position:absolute;top:max(22px,calc(env(safe-area-inset-top,0px) + 14px));inset-inline-end:max(24px,env(safe-area-inset-right,0px));width:46px;height:42px;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.menu-ov .close:hover{border-color:var(--gold)}
.menu-ov .close span{grid-area:1/1;display:block;width:22px;height:1px;background:var(--gold);transform:rotate(45deg)}
.menu-ov .close span+span{transform:rotate(-45deg)}
.mnav{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:520px}
.mnav a{width:100%;text-align:center;font-family:var(--f-display);font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.2;padding:12px 0;color:var(--ivory);border-bottom:1px solid var(--line-soft);transition:.35s}
html[lang=ar] .mnav a{font-weight:700}
.mnav a:last-child{border-bottom:0}
.mnav a:hover{color:var(--gold-hi);letter-spacing:.04em}
html[lang=ar] .mnav a:hover{letter-spacing:0}
.mnav a[aria-current=page]{color:var(--gold-hi)}
.msub{margin-top:6px;font-size:.84rem;letter-spacing:.12em;color:var(--mute)}
.menu-ov.on .mnav a{animation:mIn .6s both}
.menu-ov.on .mnav a:nth-child(2){animation-delay:.05s}.menu-ov.on .mnav a:nth-child(3){animation-delay:.1s}.menu-ov.on .mnav a:nth-child(4){animation-delay:.15s}.menu-ov.on .mnav a:nth-child(5){animation-delay:.2s}.menu-ov.on .mnav a:nth-child(6){animation-delay:.25s}
@keyframes mIn{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:none}}
body.noscroll{overflow:hidden}
.totop{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,0px));inset-inline-end:max(18px,env(safe-area-inset-right,0px));z-index:42;width:48px;height:48px;border:1px solid var(--gold);background:rgba(10,8,6,.88);color:var(--gold);cursor:pointer;display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(8px);transition:.35s}
.totop.show{opacity:1;visibility:visible;transform:none}
.totop:hover{background:var(--gold);color:var(--ink)}
#about,#visit{scroll-margin-top:84px}

/* pages */
.page{display:none}
.page.on{display:block;animation:pageIn .7s ease both}
@keyframes pageIn{from{opacity:.01}to{opacity:1}}

/* home hero: the photograph, small medallion in the corner, text kept low */
.hero{position:relative;isolation:isolate}
.hero .pic{position:relative;height:min(66vh,640px);min-height:340px;background:url(media/hero.jpg) center/cover no-repeat}
.hero .pic::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(0deg,var(--ink),transparent)}
.hero .logo{position:absolute;top:22px;inset-inline-start:max(20px,env(safe-area-inset-left,0px));width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 1px rgba(214,179,112,.5),0 8px 30px rgba(0,0,0,.6)}
.hero .in{width:100%;padding-block:8px 20px}
.hero h1{font-size:clamp(2.5rem,6vw,4.8rem);font-style:italic;font-weight:500;margin:12px 0 12px;color:var(--ivory)}
html[lang=ar] .hero h1{font-style:normal}
.hero .lead{max-width:34rem;color:#e6dac2;font-size:1.05rem}
.hero .row2{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;margin-top:26px}
.status{display:inline-flex;align-items:center;gap:10px;font-size:.84rem;letter-spacing:.06em;color:var(--ivory)}
.dot{width:8px;height:8px;border-radius:50%;background:#6b6358}
.status.open .dot{background:var(--gold-hi);box-shadow:0 0 10px rgba(243,223,168,.8)}

/* two doors */
.sec{padding-block:96px}
.head{text-align:center;margin-bottom:40px}
.head h2{font-size:clamp(2rem,4.6vw,3.4rem);margin-top:10px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.door{position:relative;padding:62px 40px 50px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 0%,rgba(214,179,112,.14),transparent 62%),var(--panel);transition:.5s}
.door::before{content:"";position:absolute;inset:9px;border:1px solid var(--line-soft);pointer-events:none;transition:.5s}
.door:hover{border-color:var(--gold);background:radial-gradient(ellipse at 50% 0%,rgba(214,179,112,.24),transparent 66%),var(--panel)}
.door:hover::before{border-color:var(--line)}
.door .t{font-family:var(--f-display);font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1.05}
html[lang=ar] .door .t{font-weight:700}
.door p{color:var(--mute);margin-top:10px;max-width:24rem}
.door .go{margin-top:26px;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:inline-flex;gap:12px;align-items:center}
html[lang=ar] .door .go{letter-spacing:0;font-size:1rem;text-transform:none}
.door .go::after{content:"";width:34px;height:1px;background:var(--gold);transition:.4s}
.door:hover .go::after{width:56px}
@media (max-width:760px){.doors{grid-template-columns:1fr}.door{padding:48px 28px 40px}}

/* about + video */
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:72px;align-items:center}
.split>*{min-width:0}
.about h2{font-size:clamp(2rem,4.6vw,3.4rem);margin-top:10px}
.about p{color:#d9cdb4;margin-top:22px;font-size:1.04rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chip{border:1px solid var(--line);padding:6px 16px;font-size:.8rem;letter-spacing:.08em;color:var(--gold)}
.frame{justify-self:center;width:min(100%,350px);padding:10px;border:1px solid var(--gold-lo);box-shadow:0 40px 90px rgba(0,0,0,.7)}
.frame .mat{padding:10px;border:1px solid var(--line-soft);background:#000}
.vid{position:relative;aspect-ratio:9/16;background:#000;overflow:hidden}
.vid video{width:100%;height:100%;object-fit:cover;cursor:pointer}
.snd{position:absolute;bottom:12px;inset-inline-end:12px;border:1px solid var(--gold);background:rgba(10,8,6,.72);color:var(--gold-hi);padding:7px 14px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
html[lang=ar] .snd{letter-spacing:0;font-size:.9rem;text-transform:none}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:48px}}

/* reviews */
.rev{border:1px solid var(--line);padding:56px 28px;text-align:center;position:relative;background:radial-gradient(ellipse at 50% 0%,rgba(214,179,112,.1),transparent 70%)}
.rev::before{content:"";position:absolute;inset:9px;border:1px solid var(--line-soft);pointer-events:none}
.stars{color:var(--gold-hi);letter-spacing:.3em;font-size:1.3rem}
.rev h3{font-size:clamp(1.8rem,4vw,2.8rem);margin:14px 0}
.rev p{color:var(--mute);max-width:36rem;margin:0 auto 28px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:26px 0;text-align:start}
.rcard{border:1px solid var(--line);padding:22px}

/* visit */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.visit>*{min-width:0}
.card{border:1px solid var(--line);padding:34px 32px;background:var(--panel)}
.card h3{font-size:1.9rem;margin-bottom:18px;color:var(--gold-hi)}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.hours td:last-child{text-align:end;color:var(--mute);font-variant-numeric:tabular-nums}
.hours tr.today td{color:var(--gold-hi);font-weight:500}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border:0}
.row .k{color:var(--mute);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;flex-basis:100%}
html[lang=ar] .row .k{letter-spacing:0;font-size:.92rem;text-transform:none}
.row .v{font-size:1.08rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row .v.ltr{direction:ltr;unicode-bidi:plaintext}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini a,.mini button{border:1px solid var(--line);background:none;padding:5px 14px;font-size:.78rem;color:var(--gold);cursor:pointer;transition:.3s}
.mini a:hover,.mini button:hover{border-color:var(--gold);background:var(--gold);color:var(--ink)}
@media (max-width:860px){.visit{grid-template-columns:1fr}}

/* inner page headings */
.ph{text-align:center;padding:96px 0 40px;background:radial-gradient(ellipse at 50% 0%,rgba(214,179,112,.16),transparent 62%)}
.ph .big{font-family:var(--f-display);font-size:clamp(3.6rem,15vw,9.5rem);font-weight:500;line-height:1;letter-spacing:.06em;margin:14px 0 4px}
html[lang=ar] .ph .big{font-weight:700;letter-spacing:0;line-height:1.3;font-size:clamp(3.4rem,14vw,8rem)}
.ph p.sub{max-width:34rem;margin:0 auto;color:#e0d4bb;font-size:1.08rem}
.ph .btn{margin-top:30px}

/* photo sets, shown only on their own page */
.tri{display:grid;gap:14px}
.tri button{padding:0;border:1px solid var(--line);background:#000;cursor:zoom-in;overflow:hidden;position:relative}
.tri button::after{content:"";position:absolute;inset:8px;border:1px solid rgba(214,179,112,.0);transition:.5s;pointer-events:none}
.tri button:hover::after{border-color:rgba(214,179,112,.55)}
.tri img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.tri button:hover img{transform:scale(1.04)}
.tri.land{grid-template-columns:1fr 1fr}
.tri.land button:first-child{grid-column:1/-1;aspect-ratio:16/8}
.tri.land button:not(:first-child){aspect-ratio:3/2}
.tri.port{grid-template-columns:repeat(3,1fr)}
.tri.port button{aspect-ratio:9/15}
@media (max-width:640px){.tri.land{grid-template-columns:1fr}.tri.land button:first-child{aspect-ratio:3/2}.tri.port{grid-template-columns:1fr 1fr}.tri.port button:first-child{grid-column:1/-1;aspect-ratio:3/4}}
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,5,4,.96);display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.on{display:grid}
.lb img{max-height:92vh;max-width:96vw;object-fit:contain;border:1px solid var(--gold-lo);padding:8px;background:#000}

/* service menu */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:56px 64px}
.menu>*{min-width:0}
.cat.wide{grid-column:1/-1}
.cat h3{font-size:2.1rem;color:var(--gold-hi);padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--gold-lo);display:flex;align-items:center;gap:14px}
.item{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.item:last-child{border:0}
.item .l{display:flex;align-items:baseline;gap:12px}
.item .n{font-size:1.06rem;font-weight:400}
.item .lead{flex:1;border-bottom:1px dotted rgba(214,179,112,.35);transform:translateY(-4px);min-width:16px}
.item .p{font-family:var(--f-display);color:var(--gold-hi);font-size:1.5rem;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
html[lang=ar] .item .p{font-weight:700;font-size:1.3rem}
.item .m{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.86rem;color:var(--mute);margin-top:3px}
.tag{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:1px 9px;align-self:center}
html[lang=ar] .tag{letter-spacing:0;font-size:.78rem}
.save{color:var(--gold)}
.note{margin-top:36px;color:var(--mute);font-size:.9rem;text-align:center}
@media (max-width:860px){.menu{grid-template-columns:1fr;gap:44px}}
.cta-band{text-align:center;padding-block:84px 96px;border-top:1px solid var(--line-soft)}
.cta-band h2{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:28px}

footer{border-top:1px solid var(--line);padding-block:40px 110px;color:var(--mute);font-size:.86rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
footer a:hover{color:var(--gold)}
.mbar{display:none}
@media (max-width:640px){
  .top .wrap{gap:12px;height:62px}
  .brand{font-size:1.3rem}
  .totop{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .hero .logo{width:72px;height:72px;top:16px}
  .hero .pic{height:56vh}
  .sec{padding-block:68px}
  .mbar{display:flex;gap:10px;position:fixed;bottom:0;left:0;right:0;z-index:45;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(10,8,6,.96);border-top:1px solid var(--line)}
  .mbar .btn{flex:1;padding:13px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="brand" href="#home" data-t="brand"></a>
  <button class="lang" id="langBtn" type="button" aria-label="Language"></button>
  <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menuOv"><span></span><span></span></button>
</div></header>

<div class="menu-ov" id="menuOv" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
  <button class="close" id="menuClose" type="button" aria-label="Close"><span></span><span></span></button>
  <nav class="mnav" aria-label="Main">
    <a href="#home" data-nav="home" data-t="nav_home"></a>
    <a href="#barber" data-nav="barber" data-t="nav_barber"></a>
    <a href="#coffee" data-nav="coffee" data-t="nav_coffee"></a>
    <a href="https://www.fresha.com/a/alf991-barber-coffee-amman-abdallah-al-hammoud-st-qxl9suh6" target="_blank" rel="noopener" data-t="book"></a>
    <a href="#home" data-scroll="about" data-t="nav_about"></a>
    <a href="#home" data-scroll="visit" data-t="nav_contact"></a>
  </nav>
  <div class="orn"><i></i></div>
  <div class="msub"><a href="https://www.instagram.com/alf991.jo" target="_blank" rel="noopener">Instagram @alf991.jo</a></div>
</div>

<button class="totop" id="totop" type="button" aria-label="Back to top"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 15V3M3 8.5 9 3l6 5.5"/></svg></button>

<main>
<!-- HOME -->
<div class="page" id="p-home">
  <div class="hero">
    <div class="pic"><img class="logo" src="media/logo.png" alt="alf991 barber &amp; coffee" width="88" height="88"></div>
    <div class="wrap"><div class="in">
      <div class="eyebrow" data-t="h_eyebrow"></div>
      <h1 data-t="h_title"></h1>
      <p class="lead" data-t="h_lead"></p>
      <div class="row2">
        <a class="btn solid" href="https://www.fresha.com/a/alf991-barber-coffee-amman-abdallah-al-hammoud-st-qxl9suh6" target="_blank" rel="noopener" data-t="book"></a>
        <a class="btn" href="#home" data-scroll="visit" data-t="visit_us"></a>
        <div class="status" id="status"><span class="dot"></span><span id="statusTxt"></span></div>
      </div>
    </div></div>
  </div>

  <div class="wrap">
    <section class="sec">
      <div class="head"><div class="eyebrow" data-t="d_eyebrow"></div><h2 class="foil" data-t="d_title"></h2><div class="orn"><i></i></div></div>
      <div class="doors">
        <a class="door" href="#barber"><div class="t foil" data-t="d_barber"></div><p data-t="d_barber_s"></p><span class="go" data-t="enter"></span></a>
        <a class="door" href="#coffee"><div class="t foil" data-t="d_coffee"></div><p data-t="d_coffee_s"></p><span class="go" data-t="enter"></span></a>
      </div>
    </section>

    <section class="sec" id="about" style="padding-top:20px">
      <div class="split">
        <div class="about">
          <div class="eyebrow" data-t="a_eyebrow"></div>
          <h2 class="foil" data-t="a_title"></h2>
          <p data-t="a_text"></p>
          <div class="chips" id="chips"></div>

function route(){const h=location.hash.slice(1);const p=['barber','coffee'].includes(h)?h:'home';
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  document.querySelectorAll('[data-nav]').forEach(a=>a.dataset.nav===p?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(p==='home')playVid();else $('#vid').pause();
  if(pending){const id=pending;pending=null;setTimeout(()=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'})},60)}else window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest('[data-scroll]');if(!a)return;e.preventDefault();pending=a.dataset.scroll;
  if(location.hash==='#home'||location.hash===''){route()}else location.hash='home'});

/* lightbox, used only by the photo sets on the Barber and Coffee pages */
document.addEventListener('click',e=>{const b=e.target.closest('[data-lb]');if(!b)return;$('#lbImg').src=b.dataset.lb;$('#lb').classList.add('on')});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});

/* video: starts by itself (muted, as browsers require), tap the picture to pause, button for sound */
const v=$('#vid');
function playVid(){const p=v.play();if(p&&p.catch)p.catch(()=>{})}
$('#snd').onclick=()=>{v.muted=!v.muted;if(!v.muted)playVid();renderSound()};
v.addEventListener('click',()=>{v.paused?playVid():v.pause()});
if('IntersectionObserver' in window){new IntersectionObserver(es=>{es.forEach(en=>{if(!$('#p-home').classList.contains('on'))return;en.isIntersecting?playVid():v.pause()})},{threshold:.25}).observe(v)}

/* full-screen menu */
const ov=$('#menuOv'),bg=$('#burger');
function setMenu(open){ov.classList.toggle('on',open);ov.setAttribute('aria-hidden',open?'false':'true');bg.setAttribute('aria-expanded',open?'true':'false');document.body.classList.toggle('noscroll',open);
  if(open)setTimeout(()=>$('#menuClose').focus(),50);else if(document.activeElement&&ov.contains(document.activeElement))bg.focus()}
bg.onclick=()=>setMenu(true);
$('#menuClose').onclick=()=>setMenu(false);
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
ov.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;
  const cur=location.hash.slice(1)||'home';
  if(a.dataset.nav&&a.dataset.nav===cur)window.scrollTo({top:0,behavior:'smooth'});
  setMenu(false)});

/* back to top */
const tt=$('#totop');
function onScroll(){tt.classList.toggle('show',window.scrollY>500)}
addEventListener('scroll',onScroll,{passive:true});
tt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

applyLang();route();onScroll();setInterval(renderStatus,60000);
</script>
</body>
</html>
